<!DOCTYPE html>
<html lang="th">

<head>
	<!-- NEW: charset is required for Thai script to display correctly -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="jspsych-6.3.1/css/jspsych.css">
	<link rel="stylesheet" href="taboo-resources/informed-consent.css">
	<!-- NEW: Thai web font for consistent rendering across devices -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap">

	</link>
	<style>
		/* NEW: Thai font */
		body,
		.jspsych-display-element,
		input,
		button {
			font-family: 'Noto Sans Thai', 'Open Sans', 'Arial', sans-serif;
		}

		.stimulus {
			font-size: 40px;
		}

		ul {
			display: inline-block;
			text-align: left;
		}


		table {
			margin-left: auto;
			margin-right: auto;
		}

		td {
			text-align: left;
		}

		table,
		th,
		td {
			border: 1px solid black;
			border-collapse: collapse;
		}

		td {
			padding: 15px;
		}

		td {
			padding: 10px;
		}

		#items tr:nth-child(even) {
			background-color: #f2f2f2;
		}

		.jspsych-btn {
			margin-bottom: 100px;
		}


		input[type="radio"] {
			-ms-transform: scale(2);
			/* IE 9 */
			-webkit-transform: scale(2);
			/* Chrome, Safari, Opera */
			transform: scale(2);
		}

		/* NEW: familiarization audio player */
		audio {
			width: 100%;
			max-width: 500px;
			margin: 20px 0;
		}

		/* NEW: rating scales (questionnaire) – keep the enlarged buttons from covering the labels */
		.jspsych-survey-likert-opts input[type="radio"] {
			transform: scale(1.5);
			margin: 8px auto 14px auto;
		}

		.jspsych-survey-likert-opts li {
			font-size: 14px;
			line-height: 1.3;
		}

		.jspsych-survey-likert-statement {
			margin-top: 1.5em;
		}

		.jspsych-display-element {
			padding: 0 12px;
			box-sizing: border-box;
		}

		.jspsych-btn:disabled {
			opacity: 0.4;
			cursor: not-allowed;
		}
	</style>

</head>
<!-- add JS psych -->
<script src="jspsych-6.3.1/jspsych.js"></script>
<script src="jspsych-6.3.1/plugins/jspsych-html-keyboard-response.js"></script>
<script src="jspsych-6.3.1/plugins/jspsych-html-button-response.js"></script>
<script src="jspsych-6.3.1/plugins/jspsych-survey-text.js"></script>
<script src="jspsych-6.3.1/plugins/jspsych-survey-text_MODIFIED.js"></script>
<script src="jspsych-6.3.1/plugins/jspsych-survey-multi-choice.js"></script>
<script src="jspsych-6.3.1/plugins/jspsych-survey-likert.js"></script>
<script src="jspsych-6.3.1/plugins/jspsych-fullscreen.js"></script>
<script src="jspsych-6.3.1/plugins/jspsych-call-function.js"></script>
<script src="jspsych-6.3.1/plugins/jspsych-external-html.js"></script>
<script src="jspsych-6.3.1/plugins/jspsych-html-slider-response.js"></script>
<!-- add jsquery library -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>

<!-- add stimuli -->
<script src="taboo-resources/thde_production_stimuli.js"></script>
<!-- add okay and notokay functions -->
<script src="taboo-resources/informed-consent.js"></script>
<!-- Check browser -->
<script src="taboo-resources/browserCheck.js"></script>
<script>
	// NEW: fallback consent functions, used only if taboo-resources/informed-consent.js is missing
	if (typeof okay !== 'function') {
		window.okay = function () { document.getElementById('start').disabled = false; };
	}
	if (typeof notokay !== 'function') {
		window.notokay = function () { document.getElementById('start').disabled = true; };
	}
</script>
<script>
	/* ================= SETTINGS ================= */
	// NEW: DataPipe experiment ID (from pipe.jspsych.org). Leave empty ("") to use save_data.php as in the original.
	var DATAPIPE_EXPERIMENT_ID = "5sSeGCqRr5RI";
	/* ============================================ */

	/* start the experiment */


	var timeline = [];

	// NEW: allowed characters in free-text answers = Latin letters + Thai block (U+0E00–U+0E7F)
	var LETTERS_TH_LAT = "[A-Za-z\\u0E00-\\u0E7F]+";
	// NEW: digits = Arabic + Thai digits (๐–๙)
	var DIGITS_TH_LAT = "[0-9\\u0E50-\\u0E59]+";


	/* get ID */

	function getXMLHttp() {
		var xmlHttp
		try {
			xmlHttp = new XMLHttpRequest();
		} catch (e) {
			try {
				xmlHttp = new ActiveXObject("Msxml2.XMLHTTP");
			} catch (e) {
				try {
					xmlHttp = new ActiveXObject("Microsoft.XMLHTTP");
				} catch (e) {
					alert("AJAX not supported.")
					return false;
				}
			}
		}
		return xmlHttp;
	}


	// Read ID from the query string
	const urlParams = new Proxy(new URLSearchParams(window.location.search), {
		get: (searchParams, prop) => searchParams.get(prop),
	});
	// CHANGED: list assignment
	// 1) ?ID=0 or ?ID=1 in the link -> that list (as in the original)
	// 2) no ID in the link + DataPipe ID set -> DataPipe condition assignment (alternates 0, 1, 0, 1 ...)
	// 3) otherwise list 0 (as in the original)
	function startExperiment() {
		if (urlParams.ID !== null) {
			runExperiment(parseInt(urlParams.ID));
		} else if (DATAPIPE_EXPERIMENT_ID) {
			fetch("https://pipe.jspsych.org/api/condition/", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ experimentID: DATAPIPE_EXPERIMENT_ID })
			})
				.then(function (r) { return r.json(); })
				.then(function (d) { runExperiment(d.condition % 2); })
				.catch(function () { runExperiment(Math.floor(Math.random() * 2)); });
		} else {
			runExperiment(0);
		}
	}

	function runExperiment(ID) {


	/* switch to full screen */

	var welcome = {
		type: "html-keyboard-response",
		stimulus: "<p>ยินดีต้อนรับสู่การศึกษาวิจัยนี้!</p><p>กดปุ่มใดก็ได้บนแป้นพิมพ์เพื่อเริ่มต้น</p>"
	};
	/* push the welcome message onto the timeline */
	timeline.push(welcome);

	var informed_consent = {
		type: 'external-html',
		url: "taboo-resources/informedconsent_thde_production.html",
		cont_btn: "start"
	};

	timeline.push(informed_consent);


	// NEW: Part 1 – Screening (questionnaire A1–A3), right after consent
	// A1 = No  -> study ends (under 18)
	// A2 = No  -> continues, flagged as non-native Thai (kept for separate analysis)
	// A3 = Yes -> study ends (fluent in German)
	var YES = "ใช่", NO = "ไม่ใช่";
	var screening = {
		type: 'survey-multi-choice',
		preamble: "ขอบคุณที่ตกลงเข้าร่วมการศึกษาวิจัยนี้! <br> ก่อนเริ่ม กรุณาตอบคำถามสั้น ๆ ต่อไปนี้",
		questions: [
			{ prompt: "คุณมีอายุ 18 ปีขึ้นไปหรือไม่", options: [YES, NO], required: true, horizontal: true, name: "A1_adult" },
			{ prompt: "ภาษาไทยเป็นภาษาแม่ของคุณหรือไม่", options: [YES, NO], required: true, horizontal: true, name: "A2_thai_native" },
			{ prompt: "คุณคิดว่าตัวเองพูดภาษาเยอรมันได้คล่องไหม", options: [YES, NO], required: true, horizontal: true, name: "A3_fluent_german" },
		],
		button_label: "ถัดไป",
		data: { trial_part: 'screening' },
		on_finish: function (data) {
			var r = data.response;
			data.native_thai = (r.A2_thai_native === YES);
			data.screened_out = (r.A1_adult === NO || r.A3_fluent_german === YES);
			jsPsych.data.addProperties({ native_thai: data.native_thai });
			if (data.screened_out) {
				jsPsych.endExperiment("<p>ขอบคุณสำหรับความสนใจในการวิจัยนี้</p>" +
					"<p>เสียดายที่คุณไม่ตรงตามเงื่อนไขของผู้เข้าร่วมการวิจัยนี้ คุณสามารถปิดหน้านี้ได้</p>");
			}
		}
	};

	timeline.push(screening);


	// CHANGED: Thai instruction text (from "Texte Experimet.docx")
	var instruction = {
		type: 'html-button-response',
		stimulus: '<div style="max-width: 1000px;text-align:left;">' +
			'<p align="center"><b><h2>คำแนะนำ</h2></b></p>' +
			'<p align="center"><b><h3 style="color:red";>โปรดอ่านคำแนะนำ</h3></b></p>' +
			'<p align="left">ก่อนเริ่ม คุณจะได้ฟังเสียงพูดภาษาเยอรมันประมาณ <b>1 นาที</b> กรุณาฟังตามธรรมชาติ โดยไม่จำเป็นต้องเข้าใจหรือจดจำเนื้อหา</p>' +
			'<p align="left">จากนั้น คุณจะเห็นคำภาษาไทย <b>12 คำ</b> สำหรับแต่ละคำ กรุณาเขียนคำตอบ <b>3 คำ</b> ที่คุณคิดว่าอาจเป็นคำภาษาเยอรมัน โดยเขียน <b>ด้วยอักษรไทย</b></p>' +
			'<p align="left">เรา <b>ไม่ต้องการคำแปลที่ถูกต้อง</b> แต่ต้องการการคาดเดาตามความรู้สึกของคุณ กรุณา <b>อย่าใช้</b> โปรแกรมแปลภาษา พจนานุกรม หรือภาษาอื่นที่คุณรู้จัก</p>' +
			'<p align="left">พยายามเขียนให้คำตอบ <b>ฟังดูเหมือนคำภาษาเยอรมัน</b> ไม่ใช่คำภาษาไทยหรือคำจริงจากภาษาอื่น และไม่ใช่ตัวอักษรที่พิมพ์แบบสุ่ม</p>' +
			'<p align="left"><b>ตัวอย่าง</b></p>' +
			'<p align="left">คำเป้าหมาย: <u><b>แก้ว</b></u></p>' +
			'<p align="left">&#10004; <u>กรุนชเทิน</u>&nbsp;&nbsp; &#10004; <u>บวร์ทซ์</u>&nbsp;&nbsp; &#10004; <u>คารุม</u></p>' +
			'<p align="left">&#10008; <u>แก้ว</u>&nbsp;&nbsp; &#10008; <u>glass</u>&nbsp;&nbsp; &#10008; ตัวอักษรแบบสุ่ม</p>' +
			"</div>",
		choices: ['ถัดไป']
	};

	timeline.push(instruction);


	/* ---------- NEW: familiarization (German audio, ca. 1 min) ---------- */

	var audio_play_count = 0;
	var audio_completed = false;
	var audio_error = false;

	var familiarization_intro = {
		type: 'html-button-response',
		stimulus: '<div style="max-width: 800px;">' +
			'<h2>ส่วนที่ 1: ฟังเสียงภาษาเยอรมัน</h2>' +
			'<p>ต่อไป คุณจะได้ฟังเสียงพูดภาษาเยอรมันประมาณ 1 นาที</p>' +
			'<p><b>กรุณาเปิดเสียงหรือใช้หูฟัง</b></p>' +
			'<p>กรุณาฟังตามธรรมชาติ ไม่จำเป็นต้องเข้าใจหรือจดจำเนื้อหา</p>' +
			'</div>',
		choices: ['เริ่มฟัง'],
		data: { trial_part: 'familiarization_intro' }
	};

	timeline.push(familiarization_intro);

	// Audio with native controls (play / pause / replay).
	// "Continue" is enabled only after the audio has been played to the end once.
	var familiarization_audio = {
		type: 'html-button-response',
		stimulus: '<div style="max-width: 800px;">' +
			'<h2>ส่วนที่ 1: ฟังเสียงภาษาเยอรมัน</h2>' +
			'<p>กดปุ่มเล่น &#9654; เพื่อฟังเสียง</p>' +
			'<audio id="familiarization-audio" controls controlsList="nodownload noplaybackrate" preload="auto">' +
			'<source src="taboo-resources/familiarization.mp3" type="audio/mpeg">' +
			'</audio>' +
			'<p>คุณสามารถหยุดชั่วคราวหรือฟังซ้ำได้</p>' +
			'<p style="color:grey;">ปุ่ม "ถัดไป" จะกดได้เมื่อฟังจบแล้ว</p>' +
			'</div>',
		choices: ['ถัดไป'],
		data: { trial_part: 'familiarization_audio' },
		on_load: function () {
			var btn = document.querySelector('#jspsych-html-button-response-button-0 button');
			var audio = document.getElementById('familiarization-audio');
			btn.disabled = true;
			audio.addEventListener('play', function () {
				if (audio.currentTime < 0.5) { audio_play_count++; }
			});
			audio.addEventListener('ended', function () {
				audio_completed = true;
				btn.disabled = false;
			});
			// fallback: if the file cannot be loaded, do not block the participant
			audio.addEventListener('error', function () {
				audio_error = true;
				btn.disabled = false;
			}, true);
		},
		on_finish: function (data) {
			var audio = document.getElementById('familiarization-audio');
			if (audio) { audio.pause(); }
			data.audio_play_count = audio_play_count;
			data.audio_completed = audio_completed;
			data.audio_error = audio_error;
		}
	};

	timeline.push(familiarization_audio);

	var task_intro = {
		type: 'html-button-response',
		stimulus: '<div style="max-width: 800px;">' +
			'<h2>ส่วนที่ 2: เขียนคำ</h2>' +
			'<p>ต่อไป คุณจะเห็นคำภาษาไทย 12 คำ ทีละคำ</p>' +
			'<p>สำหรับแต่ละคำ กรุณาเขียนคำ 3 คำ ที่คุณคิดว่าอาจเป็นคำภาษาเยอรมันที่มีความหมายเดียวกัน โดยเขียนด้วยอักษรไทย</p>' +
			'<p>คุณสามารถใช้เวลาได้ตามสบาย</p>' +
			'</div>',
		choices: ['เริ่ม'],
		data: { trial_part: 'task_intro' }
	};

	timeline.push(task_intro);

	/* ---------- end familiarization ---------- */


	// modular division to get the remainder from 0 to 7
	// initID = 90
	// id = (jatos.studyResultId - initID) % 8

	batch_size = 12;
	var stim_slice = stimuli.slice(ID * batch_size, ID * batch_size + batch_size);

	var stimuli_select = jsPsych.randomization.repeat(stim_slice, 1);

	var len = stimuli_select.length;
	var tick = Array.apply(null, { length: len + 1 }).map(Function.call, Number);
	tick.shift();

	var i;
	for (i = 0; i < len; i++) {
		stimuli_select[i]["itemcount"] = tick[i];
	}


	/* Define Trials */
	// CHANGED: Thai prompt; response pattern accepts Thai + Latin letters
	var trials1 = {
		timeline_variables: stimuli_select,
		timeline: [
			{
				type: 'survey-text-mod',
				questions: [
					{ required: true, pattern: LETTERS_TH_LAT, name: "response1" },
					{ required: true, pattern: LETTERS_TH_LAT, name: "response2" },
					{ required: true, pattern: LETTERS_TH_LAT, name: "response3" },

				],
				preamble: function () {
					return "<p><b>" + jsPsych.timelineVariable('itemcount', true) + "/" + len + "</b></p>" +
						"<br><br><p class='preamble' align='center' style='font-size:150%;'>กรุณาเขียนคำภาษาเยอรมัน 3 คำ สำหรับคำว่า <br> <b>«" + jsPsych.timelineVariable('word', true) + "»</b>";
				},
				button_label: "ถัดไป",
				post_trial_gap: 100,

				data: jsPsych.timelineVariable('log'),

				on_finish: function (data) {
					data.key_press_decoded = jsPsych.pluginAPI.convertKeyCodeToKeyCharacter(data.key_press);
				}
			},
		]
	};


	/* Define Blocks */
	timeline.push(trials1);

	// Thai translation of the original post-questionnaire
	var post_questionnare = {
		type: 'survey-text',
		preamble: "ขอบคุณ! <br> ต่อไปเป็นคำถามสั้น ๆ สองข้อเกี่ยวกับงานที่คุณเพิ่งทำ:",
		questions: [

			{ prompt: "คุณมีประสบการณ์เกี่ยวกับภาษาเยอรมันมาก่อนอย่างไรบ้าง", required: true, name: "previous_experience" },
			{ prompt: "คุณใช้วิธีใดในการคิดคำตอบของคุณ", required: true, name: "response_method" },
		],
		button_label: "ถัดไป"
	};

	timeline.push(post_questionnare);

	/* ---------- NEW: Questionnaire after the task (Parts 2 and 3) ---------- */

	// Part 2: Demographics B1–B7
	var demographics_choice = {
		type: 'survey-multi-choice',
		preamble: "เกือบเสร็จแล้ว! <br> ต่อไปนี้เป็นคำถามเกี่ยวกับตัวคุณ คำตอบของคุณจะไม่เปิดเผยตัวตน",
		questions: [
			{ prompt: "เพศ", options: ["หญิง", "ชาย", "อื่น ๆ", "ไม่ประสงค์จะระบุ"], required: true, name: "B1_gender" },
			{ prompt: "คุณพักอาศัยอยู่ในพื้นที่แบบใด", options: ["เมืองใหญ่", "เมืองขนาดเล็ก", "หมู่บ้านหรือชนบท"], required: true, name: "B3_area" },
			{ prompt: "คุณเคยเรียนภาษาเยอรมันหรือไม่", options: [YES, NO], required: true, horizontal: true, name: "B7_learned_german" },
		],
		button_label: "ถัดไป",
		data: { trial_part: 'demographics' }
	};
	timeline.push(demographics_choice);

	var demographics_text = {
		type: 'survey-text',
		questions: [
			{ prompt: "อายุ (ปี)", required: true, pattern: DIGITS_TH_LAT, name: "B2_age" },
			{ prompt: "ภาษาหรือภาษาถิ่นอื่นที่ใช้ที่บ้าน (ถ้ามี)", required: false, name: "B4_home_languages" },
			{ prompt: "ภาษาอื่น ๆ ที่คุณรู้จัก (ถ้ามี)", required: false, name: "B5_other_languages" },
		],
		button_label: "ถัดไป",
		data: { trial_part: 'demographics' }
	};
	timeline.push(demographics_text);

	var demographics_english = {
		type: 'survey-likert',
		questions: [
			{ prompt: "คุณใช้ภาษาอังกฤษได้ดีแค่ไหน", labels: ["1<br>ไม่ได้เลย", "2", "3", "4", "5<br>ดีมาก"], required: true, name: "B6_english" },
		],
		button_label: "ถัดไป",
		data: { trial_part: 'demographics' }
	};
	timeline.push(demographics_english);

	// Part 3: Language contact C1–C8 (5-point scales; saved as 0–4, score uses 1–5)
	var SCALE_FREQ = ["ไม่เคยเลย", "นาน ๆ ครั้ง", "บางครั้ง", "บ่อย", "ทุกวันหรือเกือบทุกวัน"];
	var SCALE_AMOUNT = ["ไม่มีเลย", "น้อยมาก", "ปานกลาง", "มาก", "มากที่สุด"];
	var SCALE_STUDY = ["ไม่เคย", "น้อยกว่า 1 ปี", "1 ถึงน้อยกว่า 3 ปี", "3 ถึง 10 ปี", "มากกว่า 10 ปี"];
	var SCALE_SOUND = ["ไม่คุ้นเคยเลย", "คุ้นเคยเล็กน้อย", "คุ้นเคยปานกลาง", "คุ้นเคย", "คุ้นเคยมาก"];

	var contact_1 = {
		type: 'survey-likert',
		preamble: "<p style='max-width:700px;margin:auto;'>ในคำถามต่อไปนี้ \"ภาษายุโรป\" หมายถึงภาษาต่าง ๆ เช่น ภาษาอังกฤษ ภาษาเยอรมัน หรือภาษาฝรั่งเศส</p>",
		questions: [
			{ prompt: "คุณได้ยินภาษายุโรปในชีวิตประจำวันบ่อยแค่ไหน", labels: SCALE_FREQ, required: true, name: "C1" },
			{ prompt: "คุณเห็นภาษายุโรปที่เป็นตัวหนังสือ (เช่น ป้าย โฆษณา อินเทอร์เน็ต) บ่อยแค่ไหน", labels: SCALE_FREQ, required: true, name: "C2" },
			{ prompt: "คุณดูหรือฟังสื่อ (เช่น ภาพยนตร์ เพลง YouTube) ที่เป็นภาษายุโรปบ่อยแค่ไหน", labels: SCALE_FREQ, required: true, name: "C3" },
			{ prompt: "คุณติดต่อกับนักท่องเที่ยวหรือผู้อาศัยชาวยุโรปมากแค่ไหน", labels: SCALE_AMOUNT, required: true, name: "C4" },
			{ prompt: "งานหรือการเรียนของคุณเกี่ยวข้องกับภาษายุโรปหรือผู้ที่พูดภาษาเหล่านั้นมากแค่ไหน", labels: SCALE_AMOUNT, required: true, name: "C5" },
		],
		button_label: "ถัดไป",
		data: { trial_part: 'contact' }
	};
	timeline.push(contact_1);

	// C6 only if B7 = yes (otherwise set to "never" in the score)
	var contact_c6 = {
		timeline: [{
			type: 'survey-likert',
			questions: [
				{ prompt: "คุณเคยเรียนภาษาเยอรมันอย่างเป็นระบบ (เช่น ในหลักสูตรหรือโรงเรียนสอนภาษา) นานเท่าไร", labels: SCALE_STUDY, required: true, name: "C6" },
			],
			button_label: "ถัดไป",
			data: { trial_part: 'contact' }
		}],
		conditional_function: function () {
			var d = jsPsych.data.get().filter({ trial_part: 'demographics', trial_type: 'survey-multi-choice' }).values()[0];
			return d && d.response.B7_learned_german === YES;
		}
	};
	timeline.push(contact_c6);

	var contact_2 = {
		type: 'survey-likert',
		questions: [
			{ prompt: "คุณเคยเรียนภาษายุโรป นานเท่าไร", labels: SCALE_STUDY, required: true, name: "C7" },
			{ prompt: "คุณคุ้นเคยกับเสียงของภาษาเยอรมันมากแค่ไหน", labels: SCALE_SOUND, required: true, name: "C8" },
		],
		button_label: "ถัดไป",
		data: { trial_part: 'contact' }
	};
	timeline.push(contact_2);

	// Covariates K1–K2 (not part of the score)
	var covariates = {
		type: 'survey-multi-choice',
		questions: [
			{ prompt: "คุณคุ้นเคยกับอักษรละติน (A–Z) หรือไม่", options: [YES, NO], required: true, horizontal: true, name: "K1_latin_script" },
			{ prompt: "คุณเคยเรียนภาษาบาลีหรือสันสกฤตหรือไม่", options: ["ไม่เคย", "เล็กน้อย", "เรียนอย่างจริงจัง"], required: true, name: "K2_pali_sanskrit" },
		],
		button_label: "ถัดไป",
		data: { trial_part: 'covariates' }
	};
	timeline.push(covariates);

	// Contact score = mean of C1–C8 on 1–5 (C6 = 1 "never" if skipped). Added to every data row.
	var compute_score = {
		type: 'call-function',
		func: function () {
			var items = {};
			jsPsych.data.get().filter({ trial_part: 'contact' }).values().forEach(function (t) {
				for (var k in t.response) { items[k] = t.response[k] + 1; }
			});
			var c6_skipped = !('C6' in items);
			if (c6_skipped) { items.C6 = 1; }
			var keys = ['C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7', 'C8'];
			var sum = 0;
			keys.forEach(function (k) { sum += items[k]; });
			jsPsych.data.addProperties({ contact_score: sum / keys.length, C6_skipped: c6_skipped });
		}
	};
	timeline.push(compute_score);

	/* ---------- end questionnaire ---------- */


	/* Save Data */

	// CHANGED: random 10-character ID, so that file names never collide
	var subject_id = jsPsych.randomization.randomID(10);
	jsPsych.data.addProperties({ subject_id: subject_id, list: ID });

	// CHANGED: saves via DataPipe if an ID is set, otherwise via save_data.php as in the original.
	// The experiment waits until saving is finished before showing the goodbye screen.
	function saveData(name, data, done) {
		if (DATAPIPE_EXPERIMENT_ID) {
			fetch("https://pipe.jspsych.org/api/data/", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ experimentID: DATAPIPE_EXPERIMENT_ID, filename: name, data: data })
			}).then(function () { done(); }).catch(function () { done(); });
		} else {
			$.ajax({
				type: 'post',
				cache: false,
				url: 'save_data.php',
				data: { filename: name, filedata: data }
			}).always(function () { done(); });
		}
	};


	var save_data_block = {
		type: 'call-function',
		async: true,
		func: function (done) {
			saveData("thde_production_" + subject_id + ".csv", jsPsych.data.get().csv(), done);
		},
		timing_post_trial: 200,
	};

	timeline.push(save_data_block);


	/* define a goodbye message */
	var goodbye = {
		type: "html-keyboard-response",
		stimulus: "<p>ขอบคุณที่เข้าร่วมการศึกษาวิจัยนี้!</p>"
	};
	/* push the goodbye message onto the timeline */
	timeline.push(goodbye);



	jsPsych.init({
		timeline: timeline,
		default_iti: 100,
	});

	} // end runExperiment

	startExperiment();



</script>
